<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title description">
  <title id="title">Como funciona o Painel de Acidentes em Rodovias Federais</title>
  <desc id="description">Fluxograma da preparação dos dados, publicação de arquivos JSON e GeoJSON, atendimento pela API do Cloudflare Worker e respostas do analista com Workers AI.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123a52"/>
      <stop offset="1" stop-color="#10273a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#30264e"/>
      <stop offset="1" stop-color="#1b203a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#02060c" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#45d7ff"/>
    </marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#b9a2ff"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #e8f1fb; }
      .title { font-size: 34px; font-weight: 750; letter-spacing: .2px; }
      .subtitle { font-size: 17px; fill: #a7b9cc; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 2px; fill: #71dfff; }
      .card-title { font-size: 20px; font-weight: 700; }
      .body { font-size: 15px; fill: #c7d4e2; }
      .small { font-size: 13px; fill: #9fb3c7; }
      .tag { font-size: 12px; font-weight: 700; letter-spacing: 1px; }
      .arrow-label { font-size: 13px; font-weight: 600; fill: #8fe8ff; }
      .ai-label { font-size: 13px; font-weight: 600; fill: #c7b7ff; }
      .card { stroke-width: 1.5; filter: url(#shadow); }
      .divider { stroke: #274158; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1120" rx="28" fill="url(#background)"/>
  <circle cx="1450" cy="80" r="220" fill="#0b4560" opacity=".14"/>
  <circle cx="110" cy="1050" r="250" fill="#493b78" opacity=".10"/>

  <text x="72" y="76" class="title">Como funciona o painel</text>
  <text x="74" y="108" class="subtitle">Da preparação dos dados à exploração no dashboard e às respostas do analista</text>
  <rect x="72" y="132" width="1456" height="1" fill="#244055"/>

  <text x="74" y="170" class="section">1 · PREPARAÇÃO DOS DADOS — ANTES DA PUBLICAÇÃO</text>

  <g>
    <rect x="72" y="198" width="340" height="190" rx="18" fill="#101e2d" stroke="#31516a" class="card"/>
    <rect x="94" y="220" width="94" height="25" rx="12" fill="#1a3549"/>
    <text x="141" y="237" text-anchor="middle" class="tag" fill="#7bdfff">FONTES</text>
    <text x="96" y="278" class="card-title">Dados de entrada</text>
    <text x="96" y="310" class="body">• Registros de acidentes da PRF</text>
    <text x="96" y="338" class="body">• Geometrias das rodovias</text>
    <text x="96" y="366" class="body">• Limites do Brasil e das UFs</text>
  </g>

  <path d="M420 293 H475" fill="none" stroke="#45d7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="488" y="198" width="380" height="190" rx="18" fill="url(#cyan)" stroke="#2389ab" class="card"/>
    <rect x="510" y="220" width="156" height="25" rx="12" fill="#15506a"/>
    <text x="588" y="237" text-anchor="middle" class="tag" fill="#9cecff">PROCESSAMENTO OFFLINE</text>
    <text x="512" y="278" class="card-title">tools/build_data.py</text>
    <text x="512" y="310" class="body">Valida e normaliza os registros</text>
    <text x="512" y="338" class="body">Calcula resumos e distribuições</text>
    <text x="512" y="366" class="body">Particiona registros e prepara mapas</text>
  </g>

  <path d="M876 293 H931" fill="none" stroke="#45d7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="944" y="198" width="584" height="190" rx="18" fill="#102536" stroke="#2389ab" class="card"/>
    <rect x="966" y="220" width="148" height="25" rx="12" fill="#15506a"/>
    <text x="1040" y="237" text-anchor="middle" class="tag" fill="#9cecff">CLOUDFLARE ASSETS</text>
    <text x="968" y="278" class="card-title">Arquivos públicos em <tspan fill="#77e2ff">public/data/</tspan></text>
    <text x="968" y="310" class="body">Resumos e distribuições · registros completos em blocos</text>
    <text x="968" y="338" class="body">Ocorrências geolocalizadas · rodovias e limites em GeoJSON</text>
    <text x="968" y="366" class="small">O Worker lê os arquivos preparados; não processa o CSV bruto a cada acesso.</text>
  </g>

  <path d="M1236 390 V425" fill="none" stroke="#45d7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1252" y="414" class="arrow-label">binding ASSETS</text>

  <text x="74" y="454" class="section">2 · USO DO DASHBOARD</text>

  <g>
    <rect x="72" y="482" width="270" height="202" rx="18" fill="#101e2d" stroke="#31516a" class="card"/>
    <circle cx="108" cy="520" r="17" fill="#17344a" stroke="#45d7ff"/>
    <path d="M100 520 h16 M108 512 v16" stroke="#8fe8ff" stroke-width="2" stroke-linecap="round"/>
    <text x="136" y="527" class="card-title">Pessoa usuária</text>
    <text x="96" y="568" class="body">Escolhe ano e UF</text>
    <text x="96" y="596" class="body">Explora o mapa por BR</text>
    <text x="96" y="624" class="body">Consulta tabelas ou pergunta</text>
    <text x="96" y="652" class="body">ao analista em linguagem natural</text>
  </g>

  <path d="M350 583 H398" fill="none" stroke="#45d7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="410" y="482" width="370" height="202" rx="18" fill="#101e2d" stroke="#31516a" class="card"/>
    <rect x="434" y="504" width="132" height="25" rx="12" fill="#1a3549"/>
    <text x="500" y="521" text-anchor="middle" class="tag" fill="#7bdfff">INTERFACE ESTÁTICA</text>
    <text x="434" y="562" class="card-title">Navegador</text>
    <text x="434" y="592" class="body">JavaScript coordena filtros e consultas</text>
    <text x="434" y="620" class="body">Gráficos, tabelas e mapa vetorial</text>
    <text x="434" y="648" class="body">Pede só os recortes necessários</text>
  </g>

  <path d="M788 583 H836" fill="none" stroke="#45d7ff" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="812" y="570" text-anchor="middle" class="arrow-label">/api</text>

  <g>
    <rect x="848" y="482" width="390" height="202" rx="18" fill="url(#cyan)" stroke="#2389ab" class="card"/>
    <rect x="872" y="504" width="153" height="25" rx="12" fill="#15506a"/>
    <text x="948" y="521" text-anchor="middle" class="tag" fill="#9cecff">CLOUDFLARE WORKER</text>
    <text x="872" y="562" class="card-title">Python + Flask</text>
    <text x="872" y="592" class="body">Valida filtros e parâmetros</text>
    <text x="872" y="620" class="body">Consulta os JSONs via ASSETS</text>
    <text x="872" y="648" class="body">Calcula, agrupa ou pagina resultados</text>
  </g>

  <path d="M1246 583 H1294" fill="none" stroke="#45d7ff" stroke-width="3" marker-end="url(#arrow)"/>

  <g>
    <rect x="1306" y="482" width="222" height="202" rx="18" fill="#101e2d" stroke="#31516a" class="card"/>
    <text x="1328" y="526" class="card-title">Dashboard</text>
    <text x="1328" y="562" class="body">Indicadores</text>
    <text x="1328" y="590" class="body">Gráficos</text>
    <text x="1328" y="618" class="body">Tabelas</text>
    <text x="1328" y="646" class="body">Mapa</text>
  </g>
  <path d="M1417 698 V719 H590 V694" fill="none" stroke="#45d7ff" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="1000" y="713" text-anchor="middle" class="arrow-label">resposta JSON para a interface</text>

  <rect x="72" y="740" width="1456" height="1" fill="#244055"/>
  <text x="74" y="776" class="section">3 · CAMINHO DE UMA PERGUNTA À IA</text>

  <g>
    <rect x="92" y="804" width="398" height="174" rx="18" fill="url(#purple)" stroke="#7866b7" class="card"/>
    <circle cx="128" cy="842" r="17" fill="#44366c"/>
    <text x="128" y="847" text-anchor="middle" class="tag" fill="#ddd3ff">1</text>
    <text x="158" y="849" class="card-title">Workers AI planeja</text>
    <text x="116" y="890" class="body">Interpreta a pergunta e escolhe</text>
    <text x="116" y="918" class="body">ferramentas de domínio permitidas.</text>
    <text x="116" y="950" class="small">Não recebe a base inteira nem gera SQL.</text>
  </g>

  <path d="M498 891 H548" fill="none" stroke="#b9a2ff" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <g>
    <rect x="560" y="804" width="474" height="174" rx="18" fill="url(#cyan)" stroke="#2389ab" class="card"/>
    <circle cx="596" cy="842" r="17" fill="#15506a"/>
    <text x="596" y="847" text-anchor="middle" class="tag" fill="#c1f3ff">2</text>
    <text x="626" y="849" class="card-title">Worker executa consultas seguras</text>
    <text x="584" y="890" class="body">Valida filtros; soma, compara, agrupa</text>
    <text x="584" y="918" class="body">ou busca registros nas partições JSON.</text>
    <text x="584" y="950" class="small">Limites de recorte, varredura e amostra são aplicados.</text>
  </g>

  <path d="M1042 891 H1092" fill="none" stroke="#b9a2ff" stroke-width="3" marker-end="url(#arrowPurple)"/>

  <g>
    <rect x="1104" y="804" width="404" height="174" rx="18" fill="url(#purple)" stroke="#7866b7" class="card"/>
    <circle cx="1140" cy="842" r="17" fill="#44366c"/>
    <text x="1140" y="847" text-anchor="middle" class="tag" fill="#ddd3ff">3</text>
    <text x="1170" y="849" class="card-title">Workers AI redige</text>
    <text x="1128" y="890" class="body">Resume apenas os resultados calculados</text>
    <text x="1128" y="918" class="body">e devolve resposta com dados e filtros.</text>
    <text x="1128" y="950" class="small">A interface exibe a resposta e suas evidências.</text>
  </g>

  <path d="M1306 980 V1006 H596 V690" fill="none" stroke="#b9a2ff" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrowPurple)"/>
  <text x="950" y="1001" text-anchor="middle" class="ai-label">resposta fundamentada volta ao navegador</text>

  <rect x="72" y="1024" width="1456" height="58" rx="14" fill="#101b29" stroke="#344457"/>
  <text x="96" y="1049" class="small">
    <tspan font-weight="700" fill="#ffcf83">Importante:</tspan>
    <tspan> contagens descrevem registros, não provam causalidade nem medem risco sem exposição ao tráfego.</tspan>
  </text>
  <text x="96" y="1072" class="small">No mapa, coordenadas e amostras limitadas significam que pontos visíveis não equivalem ao total do recorte.</text>
</svg>
